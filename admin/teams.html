<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ALL-IN Basketball League - 球隊管理">
    <meta name="theme-color" content="#1a1a2e">
    <title>球隊管理 — ALL-IN Basketball League</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <header class="site-header">
        <nav class="main-nav" aria-label="主導航">
            <div class="nav-container">
                <a href="../index.html" class="nav-logo" aria-label="ALL-IN Basketball League 首頁">
                    <img src="../images/logo.png" alt="ALL-IN Basketball League" class="logo-img">
                    <span class="logo-text">ALL-IN</span>
                </a>
                <button class="hamburger-btn" aria-label="開啟選單" aria-expanded="false" aria-controls="nav-menu">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>
                <ul id="nav-menu" class="nav-links" role="menubar">
                    <li role="none"><a href="../index.html" class="nav-link" role="menuitem" data-i18n="nav.home">首頁</a></li>
                    <li role="none"><a href="../schedule.html" class="nav-link" role="menuitem" data-i18n="nav.schedule">賽程</a></li>
                    <li role="none"><a href="../team.html" class="nav-link" role="menuitem" data-i18n="nav.teams">球隊</a></li>
                    <li role="none"><a href="../player.html" class="nav-link" role="menuitem" data-i18n="nav.players">球員</a></li>
                    <li role="none"><a href="../standings.html" class="nav-link" role="menuitem" data-i18n="nav.standings">排行榜</a></li>
                    <li role="none"><a href="../archive.html" class="nav-link" role="menuitem" data-i18n="nav.archive">Hall of Fame 冠軍球隊</a></li>
                    <li role="none"><a href="index.html" class="nav-link active" role="menuitem" data-i18n="nav.admin">管理後台</a></li>
                </ul>
                <div class="nav-actions">
                    <button class="lang-switch-btn" aria-label="切換語言" data-i18n-attr="aria-label:nav.langSwitch">
                        <span data-i18n="nav.lang">EN</span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <section class="section">
            <div class="container">
                <h1 class="section-title" data-i18n="admin.teamManage">球隊管理</h1>
                <div id="team-message" class="admin-message" role="alert" hidden></div>

                <!-- 賽季選擇 -->
                <div class="admin-form-group">
                    <label for="season-select" class="admin-label" data-i18n="admin.selectSeason">選擇賽季</label>
                    <select id="season-select" class="admin-select"></select>
                </div>

                <div class="admin-toolbar">
                    <button id="btn-create-team" class="btn btn-primary" data-i18n="admin.createTeam" disabled>建立球隊</button>
                    <button id="btn-show-import" class="btn btn-outline" disabled>由其他賽季複製球隊</button>
                </div>

                <div id="team-import-card" class="admin-card" hidden>
                    <h2 class="admin-card-title">由其他賽季複製球隊</h2>
                    <div class="admin-form-row">
                        <div class="admin-form-group">
                            <label for="import-source-season" class="admin-label">來源賽季</label>
                            <select id="import-source-season" class="admin-select"></select>
                        </div>
                    </div>
                    <div class="admin-toolbar">
                        <button id="btn-load-import-teams" class="btn btn-outline">載入來源球隊</button>
                        <button id="btn-select-all-import" class="btn btn-outline" hidden>全選</button>
                    </div>
                    <div id="import-teams-list" class="admin-card" style="background:var(--color-bg);margin:var(--spacing-md) 0" hidden></div>
                    <div class="admin-actions">
                        <button id="btn-copy-import-teams" class="btn btn-primary" hidden>複製已選球隊到目前賽季</button>
                        <button id="btn-cancel-import" class="btn btn-outline">取消</button>
                    </div>
                </div>

                <!-- Season 3 賽制設定 -->
                <div id="season3-card" class="admin-card" hidden>
                    <h2 class="admin-card-title">Season 3 賽制設定</h2>
                    <div id="season3-flag-row" class="admin-toolbar" hidden>
                        <button id="btn-season3-flag" class="btn btn-primary">標示為 Season 3 賽制</button>
                    </div>
                    <p id="season3-status" class="text-muted" style="font-size:0.85rem;margin:0 0 10px"></p>
                    <div id="season3-draw" hidden>
                        <div class="admin-toolbar" style="flex-wrap:wrap;gap:8px" id="season3-draw-counters"></div>
                        <div class="admin-toolbar">
                            <button id="btn-season3-autodraw" class="btn btn-outline">隨機抽籤</button>
                            <button id="btn-season3-generate" class="btn btn-primary" disabled>確認分組並生成組內預賽賽程</button>
                        </div>
                        <div id="season3-draw-list" class="admin-card" style="background:var(--color-bg);margin:var(--spacing-md) 0"></div>
                    </div>
                    <div id="season3-groups-view" hidden></div>
                </div>

                <!-- 球隊表單 -->
                <div id="team-form" class="admin-card" hidden>
                    <h2 id="team-form-title" class="admin-card-title" data-i18n="admin.createTeam">建立球隊</h2>
                    <div class="admin-form-group">
                        <label for="team-name" class="admin-label" data-i18n="admin.teamName">球隊名稱</label>
                        <input type="text" id="team-name" class="admin-input" required>
                    </div>
                    <div class="admin-form-group">
                        <label for="team-division" class="admin-label">分組</label>
                        <input type="text" id="team-division" class="admin-input" list="division-options" placeholder="DIVISION CLUTCH / FASTBREAK / CROSSOVER">
                        <datalist id="division-options">
                            <option value="DIVISION CLUTCH"></option>
                            <option value="DIVISION FASTBREAK"></option>
                            <option value="DIVISION CROSSOVER"></option>
                        </datalist>
                    </div>
                    <div class="admin-form-group">
                        <label for="team-logo" class="admin-label" data-i18n="admin.logo">隊徽圖片</label>
                        <input type="file" id="team-logo" class="admin-input" accept="image/*">
                        <img id="team-logo-preview" alt="" hidden style="width:56px;height:56px;object-fit:cover;border-radius:8px;margin-top:10px">
                    </div>
                    <div class="admin-form-row">
                        <div class="admin-form-group">
                            <label for="team-captain" class="admin-label">負責人</label>
                            <input type="text" id="team-captain" class="admin-input">
                        </div>
                        <div class="admin-form-group">
                            <label for="team-whatsapp" class="admin-label">負責人 WhatsApp</label>
                            <input type="tel" id="team-whatsapp" class="admin-input">
                        </div>
                    </div>
                    <div class="admin-form-group">
                        <label for="team-desc" class="admin-label" data-i18n="team.description">球隊簡介</label>
                        <textarea id="team-desc" class="admin-textarea" rows="3"></textarea>
                    </div>
                    <div class="admin-form-row">
                        <div class="admin-form-group">
                            <label for="team-jersey-home" class="admin-label">主場球衣顏色</label>
                            <input type="text" id="team-jersey-home" class="admin-input" placeholder="例：白色 或 #ffffff">
                        </div>
                        <div class="admin-form-group">
                            <label for="team-jersey-away" class="admin-label">客場球衣顏色</label>
                            <input type="text" id="team-jersey-away" class="admin-input" placeholder="例：黑色 或 #000000">
                        </div>
                    </div>
                    <div class="admin-actions">
                        <button id="btn-save-team" class="btn btn-primary" data-i18n="admin.save">儲存</button>
                        <button id="btn-cancel-team" class="btn btn-outline" data-i18n="admin.cancel">取消</button>
                    </div>
                </div>

                <!-- 球隊列表 -->
                <div class="table-wrapper">
                    <table class="data-table" id="teams-table">
                        <thead>
                            <tr>
                                <th data-i18n="admin.teamName">球隊名稱</th>
                                <th>分組</th>
                                <th>球衣顏色</th>
                                <th>負責人</th>
                                <th>負責人 WhatsApp</th>
                                <th>自助管理連結</th>
                                <th>不可出賽日期連結</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="teams-body">
                            <tr><td colspan="8" class="text-muted" data-i18n="common.loading">載入中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <img src="../images/logo.png" alt="ALL-IN Basketball League" class="footer-logo">
                    <p class="footer-tagline" data-i18n="footer.tagline">全力以赴</p>
                </div>
                <div class="footer-copyright">
                    <p>&copy; <span id="current-year"></span> ALL-IN Basketball League.</p>
                </div>
            </div>
        </div>
    </footer>

    <script>document.getElementById('current-year').textContent = new Date().getFullYear();</script>
    <script src="../js/utils.js?v=20260409"></script>
    <script src="../js/api.js?v=20260409"></script>
    <script src="../js/image-import.js?v=20260410"></script>
    <script src="../js/i18n.js?v=20260409"></script>
    <script src="../js/navigation.js?v=20260409"></script>
    <script src="auth.js?v=20260410"></script>
    <script>
    I18n.init();

    (function () {
        var editingId = null;
        var seasonSelect = document.getElementById('season-select');
        var msgEl = document.getElementById('team-message');
        var formEl = document.getElementById('team-form');
        var formTitle = document.getElementById('team-form-title');
        var tbody = document.getElementById('teams-body');
        var createBtn = document.getElementById('btn-create-team');
        var importBtn = document.getElementById('btn-show-import');
        var importCard = document.getElementById('team-import-card');
        var importSourceSeason = document.getElementById('import-source-season');
        var importTeamsList = document.getElementById('import-teams-list');
        var loadImportTeamsBtn = document.getElementById('btn-load-import-teams');
        var selectAllImportBtn = document.getElementById('btn-select-all-import');
        var copyImportTeamsBtn = document.getElementById('btn-copy-import-teams');
        var cancelImportBtn = document.getElementById('btn-cancel-import');
        var allSeasons = [];
        var teamLogoImport = ImageImport.createController({
            input: 'team-logo',
            preview: 'team-logo-preview',
            maxSize: 900,
            onError: function (err) { showMsg((err && err.message) || '圖片匯入失敗', 'error'); }
        });

        function showMsg(text, type) {
            msgEl.textContent = text;
            msgEl.className = 'admin-message admin-message--' + type;
            msgEl.hidden = false;
            setTimeout(function () { msgEl.hidden = true; }, 4000);
        }

        function resetForm() {
            editingId = null;
            formTitle.textContent = I18n.t('admin.createTeam');
            document.getElementById('team-name').value = '';
            document.getElementById('team-division').value = '';
            teamLogoImport.setValue('');
            document.getElementById('team-captain').value = '';
            document.getElementById('team-whatsapp').value = '';
            document.getElementById('team-desc').value = '';
            document.getElementById('team-jersey-home').value = '';
            document.getElementById('team-jersey-away').value = '';
            formEl.hidden = true;
        }

        function loadSeasons() {
            API.getSeasons().then(function (seasons) {
                allSeasons = seasons || [];
                seasonSelect.innerHTML = '<option value="">--</option>';
                importSourceSeason.innerHTML = '<option value="">--</option>';
                allSeasons.forEach(function (s) {
                    var opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.name;
                    seasonSelect.appendChild(opt);

                    var importOpt = document.createElement('option');
                    importOpt.value = s.id;
                    importOpt.textContent = s.name;
                    importSourceSeason.appendChild(importOpt);
                });
            });
        }

        function loadTeams() {
            var sid = seasonSelect.value;
            if (!sid) { tbody.innerHTML = '<tr><td colspan="8" class="text-muted">' + I18n.t('common.noData') + '</td></tr>'; return; }
            API.getTeams(sid).then(function (teams) {
                if (!teams || teams.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-muted">' + I18n.t('common.noData') + '</td></tr>';
                    return;
                }

                // Auto-generate tokens for teams that don't have one — fire & forget (don't block rendering)
                teams.forEach(function(t) {
                    if (!t.teamToken) {
                        t.teamToken = _genToken();
                        API.post('updateTeam', { teamId: t.id, seasonId: sid, teamToken: t.teamToken }).catch(function(){});
                    }
                });

                // Render immediately
                _renderTeamsTable(teams, sid);
            }).catch(function () {
                tbody.innerHTML = '<tr><td colspan="8" class="text-muted">' + I18n.t('error.loadFailed') + '</td></tr>';
            });
        }

        function _renderTeamsTable(teams, sid) {
            tbody.innerHTML = '';
            teams.forEach(function (t) {
                var tr = document.createElement('tr');
                                var siteRoot = window.location.origin + window.location.pathname.replace(/\/admin\/teams\.html.*$/, '');
                                var manageUrl = t.teamToken ? (siteRoot + '/team-manage.html?token=' + t.teamToken) : '';
                                var availabilityUrl = t.teamToken ? (siteRoot + '/team-availability.html?token=' + t.teamToken) : '';
                var linkHtml = manageUrl
                    ? '<div style="font-size:0.72rem;word-break:break-all;margin-bottom:4px">'
                      + '<a href="' + manageUrl + '" target="_blank" rel="noopener">' + manageUrl + '</a>'
                      + '</div>'
                                            + '<button class="btn btn-sm btn-outline btn-copy" data-url="' + _esc(manageUrl) + '">複製管理連結</button>'
                                        : '—';
                                var availabilityLinkHtml = availabilityUrl
                                        ? '<div style="font-size:0.72rem;word-break:break-all;margin-bottom:4px">'
                                            + '<a href="' + availabilityUrl + '" target="_blank" rel="noopener">' + availabilityUrl + '</a>'
                                            + '</div>'
                                            + '<button class="btn btn-sm btn-outline btn-copy" data-url="' + _esc(availabilityUrl) + '">複製填報連結</button>'
                    : '—';
                var jerseyHtml = '';
                if (t.jerseyHome) jerseyHtml += '<span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:' + _jerseyColor(t.jerseyHome) + ';border:1px solid rgba(255,255,255,0.2);vertical-align:middle"></span> 主:' + _esc(t.jerseyHome);
                if (t.jerseyHome && t.jerseyAway) jerseyHtml += '<br>';
                if (t.jerseyAway) jerseyHtml += '<span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:' + _jerseyColor(t.jerseyAway) + ';border:1px solid rgba(255,255,255,0.2);vertical-align:middle"></span> 客:' + _esc(t.jerseyAway);
                if (!jerseyHtml) jerseyHtml = '—';
                var divisionLabel = s3TeamLabels[t.id] || t.division || '—';
                tr.innerHTML =
                    '<td>' + _esc(t.name) + '</td>' +
                    '<td>' + _esc(divisionLabel) + '</td>' +
                    '<td style="font-size:0.8rem">' + jerseyHtml + '</td>' +
                    '<td>' + _esc(t.captain) + '</td>' +
                    '<td>' + _esc(t.captainWhatsApp) + '</td>' +
                    '<td>' + linkHtml + '</td>' +
                    '<td>' + availabilityLinkHtml + '</td>' +
                    '<td>' +
                    '<button class="btn btn-sm btn-outline btn-edit" data-id="' + t.id + '">' + I18n.t('admin.edit') + '</button> ' +
                    '<button class="btn btn-sm btn-outline btn-delete" data-id="' + t.id + '">' + I18n.t('admin.delete') + '</button>' +
                    '</td>';
                tbody.appendChild(tr);
            });
            tbody.querySelectorAll('.btn-copy').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var url = btn.getAttribute('data-url');
                    navigator.clipboard.writeText(url).then(function() {
                                var original = btn.textContent;
                        btn.textContent = '已複製！';
                                setTimeout(function() { btn.textContent = original; }, 2000);
                    });
                });
            });
            bindRowButtons(teams);
        }

        function _jerseyColor(color) {
            if (!color) return 'transparent';
            var map = {
                '白色': '#ffffff', '白': '#ffffff',
                '黑色': '#222222', '黑': '#222222',
                '紅色': '#e53e3e', '紅': '#e53e3e',
                '藍色': '#3182ce', '藍': '#3182ce',
                '綠色': '#38a169', '綠': '#38a169',
                '黃色': '#ecc94b', '黃': '#ecc94b',
                '橙色': '#ed8936', '橙': '#ed8936',
                '紫色': '#805ad5', '紫': '#805ad5',
                '灰色': '#a0aec0', '灰': '#a0aec0',
                '深藍': '#1a365d', '淺藍': '#63b3ed',
                '深紅': '#9b2c2c', '粉紅': '#ed64a6', '粉紅色': '#ed64a6',
                '金色': '#d69e2e', '銀色': '#cbd5e0'
            };
            return map[color] || (color.charAt(0) === '#' ? color : 'transparent');
        }

        function bindRowButtons(teams) {
            tbody.querySelectorAll('.btn-edit').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var id = btn.getAttribute('data-id');
                    var t = teams.find(function (x) { return x.id === id; });
                    if (!t) return;
                    editingId = id;
                    formTitle.textContent = I18n.t('admin.edit');
                    document.getElementById('team-name').value = t.name || '';
                    document.getElementById('team-division').value = t.division || '';
                    teamLogoImport.setValue(t.logo || '');
                    document.getElementById('team-captain').value = t.captain || '';
                    document.getElementById('team-whatsapp').value = t.captainWhatsApp || '';
                    document.getElementById('team-desc').value = t.description || '';
                    document.getElementById('team-jersey-home').value = t.jerseyHome || '';
                    document.getElementById('team-jersey-away').value = t.jerseyAway || '';
                    formEl.hidden = false;
                });
            });
            tbody.querySelectorAll('.btn-delete').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var id = btn.getAttribute('data-id');
                    if (!confirm('Remove this team from active team management? Existing matchups, division assignments, scores, and standings points will remain unchanged.')) return;
                    API.post('deleteTeam', { teamId: id }).then(function () {
                        showMsg('Team removed; matchup and standings points preserved', 'success');
                        loadTeams();
                        loadSeason3Setup();
                    }).catch(function (err) { showMsg((err && err.message) || I18n.t('error.submitFailed'), 'error'); });
                });
            });
        }

        seasonSelect.addEventListener('change', function () {
            createBtn.disabled = !seasonSelect.value;
            importBtn.disabled = !seasonSelect.value;
            loadTeams();
            loadSeason3Setup();
        });

        createBtn.addEventListener('click', function () { resetForm(); formEl.hidden = false; });
        document.getElementById('btn-cancel-team').addEventListener('click', resetForm);

        importBtn.addEventListener('click', function () {
            if (!seasonSelect.value) { showMsg('請先選擇目標賽季', 'error'); return; }
            importCard.hidden = false;
            importTeamsList.hidden = true;
            selectAllImportBtn.hidden = true;
            copyImportTeamsBtn.hidden = true;
            importSourceSeason.value = guessPreviousSeasonId();
        });

        cancelImportBtn.addEventListener('click', function () {
            importCard.hidden = true;
        });

        loadImportTeamsBtn.addEventListener('click', loadImportTeams);

        selectAllImportBtn.addEventListener('click', function () {
            importTeamsList.querySelectorAll('input[type="checkbox"]').forEach(function (box) { box.checked = true; });
        });

        copyImportTeamsBtn.addEventListener('click', function () {
            var teamIds = Array.from(importTeamsList.querySelectorAll('input[type="checkbox"]:checked')).map(function (box) { return box.value; });
            if (teamIds.length === 0) { showMsg('請選擇要複製的球隊', 'error'); return; }
            copyImportTeamsBtn.disabled = true;
            copyImportTeamsBtn.textContent = '複製中...';
            API.post('copyTeamsToSeason', {
                sourceSeasonId: importSourceSeason.value,
                targetSeasonId: seasonSelect.value,
                teamIds: teamIds
            }).then(function (result) {
                var skipped = result && result.skippedCount ? '，已略過 ' + result.skippedCount + ' 隊同名球隊' : '';
                var players = result && result.copiedPlayers ? '，球員 ' + result.copiedPlayers + ' 人' : '';
                showMsg('已複製 ' + ((result && result.copiedCount) || 0) + ' 隊' + players + skipped, 'success');
                importCard.hidden = true;
                loadTeams();
                loadSeason3Setup();
            }).catch(function (err) {
                showMsg((err && err.message) || I18n.t('error.submitFailed'), 'error');
            }).finally(function () {
                copyImportTeamsBtn.disabled = false;
                copyImportTeamsBtn.textContent = '複製已選球隊到目前賽季';
            });
        });

        function guessPreviousSeasonId() {
            var target = seasonSelect.value;
            var targetIndex = allSeasons.findIndex(function (s) { return s.id === target; });
            if (targetIndex > 0) return allSeasons[targetIndex - 1].id;
            var other = allSeasons.find(function (s) { return s.id !== target; });
            return other ? other.id : '';
        }

        function loadImportTeams() {
            var sourceId = importSourceSeason.value;
            if (!sourceId) { showMsg('請選擇來源賽季', 'error'); return; }
            if (sourceId === seasonSelect.value) { showMsg('來源賽季不可與目前賽季相同', 'error'); return; }
            importTeamsList.hidden = false;
            importTeamsList.innerHTML = '<p class="text-muted">載入中...</p>';
            selectAllImportBtn.hidden = true;
            copyImportTeamsBtn.hidden = true;
            Promise.all([API.getTeams(sourceId), API.getTeams(seasonSelect.value)]).then(function (results) {
                var sourceTeams = results[0] || [];
                var targetTeams = results[1] || [];
                var targetNames = {};
                targetTeams.forEach(function (team) { targetNames[(team.name || '').toLowerCase()] = true; });
                if (sourceTeams.length === 0) {
                    importTeamsList.innerHTML = '<p class="text-muted">來源賽季暫無球隊</p>';
                    return;
                }
                importTeamsList.innerHTML = sourceTeams.map(function (team) {
                    var exists = targetNames[(team.name || '').toLowerCase()];
                    return '<label style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;opacity:' + (exists ? '0.55' : '1') + '">' +
                        '<input type="checkbox" value="' + _esc(team.id) + '" ' + (exists ? 'disabled' : 'checked') + ' style="margin-top:4px">' +
                        '<span><strong>' + _esc(team.name) + '</strong>' +
                        '<br><span class="text-muted" style="font-size:0.82rem">' + _esc(team.captain || '') + ' ' + _esc(team.captainWhatsApp || '') + (exists ? '（目標賽季已有同名球隊）' : '') + '</span></span>' +
                        '</label>';
                }).join('');
                selectAllImportBtn.hidden = false;
                copyImportTeamsBtn.hidden = false;
            }).catch(function () {
                importTeamsList.innerHTML = '<p class="text-muted">載入失敗</p>';
            });
        }

        // --- Season 3 賽制設定 ---
        var season3Card = document.getElementById('season3-card');
        var season3FlagRow = document.getElementById('season3-flag-row');
        var season3FlagBtn = document.getElementById('btn-season3-flag');
        var season3StatusEl = document.getElementById('season3-status');
        var season3Draw = document.getElementById('season3-draw');
        var season3DrawCounters = document.getElementById('season3-draw-counters');
        var season3DrawList = document.getElementById('season3-draw-list');
        var season3GroupsView = document.getElementById('season3-groups-view');
        var season3AutodrawBtn = document.getElementById('btn-season3-autodraw');
        var season3GenerateBtn = document.getElementById('btn-season3-generate');
        var season3GroupIds = ['A', 'B', 'C'];
        var season3AllowedSizes = [6, 7];
        var s3GroupsData = null;
        var s3TeamLabels = {};
        var s3DrawState = [];
        var s3GroupSize = 6;

        function season3SizeOf(teamCount) {
            return teamCount % season3GroupIds.length === 0 && season3AllowedSizes.indexOf(teamCount / season3GroupIds.length) !== -1
                ? teamCount / season3GroupIds.length : 0;
        }

        function getCurrentSeason() {
            return allSeasons.filter(function (s) { return s.id === seasonSelect.value; })[0] || null;
        }

        function isSeasonThree(season) {
            var format = String((season && (season.formatVersion || season.competitionFormat || season.format)) || '').toLowerCase();
            var name = String((season && (season.name || season.id)) || '');
            return format === 'season3' || format === 'season-3' || format === 's3' || /(?:season|s)\s*0?3\b/i.test(name) || /第\s*(?:三|3)\s*(?:季|屆)/.test(name);
        }

        function resetSeason3Panel() {
            season3Card.hidden = true;
            season3FlagRow.hidden = true;
            season3Draw.hidden = true;
            season3GroupsView.hidden = true;
            season3StatusEl.textContent = '';
            season3DrawCounters.innerHTML = '';
            season3DrawList.innerHTML = '';
            season3GroupsView.innerHTML = '';
            s3GroupsData = null;
            s3TeamLabels = {};
            s3DrawState = [];
        }

        function loadSeason3Setup() {
            resetSeason3Panel();
            var season = getCurrentSeason();
            if (!isSeasonThree(season)) return;
            season3Card.hidden = false;
            if (!String((season && (season.formatVersion || season.competitionFormat || season.format)) || '').trim()) {
                season3FlagRow.hidden = false;
                return;
            }
            season3StatusEl.textContent = '載入中...';
            Promise.all([
                API.getTeams(seasonSelect.value),
                API.get('season3Groups', { seasonId: seasonSelect.value }).catch(function (err) { return { __error: (err && err.message) || '載入失敗' }; }),
                API.getGames(seasonSelect.value).catch(function () { return []; })
            ]).then(function (results) {
                var groupsResult = results[1];
                if (groupsResult && groupsResult.__error) {
                    var hint = groupsResult.__error.indexOf('無效的請求動作') !== -1 ? '（請先更新 Apps Script 後端 Code.gs 並重新部署）' : '';
                    season3StatusEl.textContent = 'Season 3 分組資料載入失敗：' + groupsResult.__error + hint;
                    return;
                }
                s3GroupsData = groupsResult;
                buildSeason3TeamLabels();
                if (Object.keys(s3TeamLabels).length) loadTeams();
                renderSeason3Setup(results[0] || [], results[2] || []);
            }).catch(function (err) {
                season3StatusEl.textContent = '載入失敗：' + ((err && err.message) || '請重試');
            });
        }

        function buildSeason3TeamLabels() {
            s3TeamLabels = {};
            if (!s3GroupsData) return;
            (s3GroupsData.preliminary || []).forEach(function (group) {
                (group.teams || []).forEach(function (row) {
                    s3TeamLabels[row.teamId] = '分組賽 Group ' + group.groupId;
                });
            });
        }

        function renderSeason3Setup(teams, games) {
            if (s3GroupsData && s3GroupsData.preliminary && s3GroupsData.preliminary.length) {
                s3GroupSize = s3GroupsData.groupSize || ((s3GroupsData.preliminary[0] || {}).teams || []).length || 6;
                season3Draw.hidden = true;
                renderSeason3GroupsView(s3GroupsData, games);
                return;
            }
            season3GroupsView.hidden = true;
            season3GroupsView.innerHTML = '';
            var count = (teams || []).length;
            s3GroupSize = season3SizeOf(count);
            season3StatusEl.textContent = '現有球隊 ' + count + ' 支；' + (s3GroupSize
                ? '可進行分組抽籤（' + season3GroupIds.length + ' 組 × 每組 ' + s3GroupSize + ' 隊）'
                : '分組抽籤需要 18 支（3 組 × 6）或 21 支（3 組 × 7）現役球隊');
            if (s3GroupSize) {
                season3Draw.hidden = false;
                setupSeason3Draw(teams);
            } else {
                season3Draw.hidden = true;
            }
        }

        function setupSeason3Draw(teams) {
            s3DrawState = teams.map(function (t) { return { id: t.id, name: t.name, group: '' }; });
            season3DrawList.innerHTML = '';
            s3DrawState.forEach(function (row, index) {
                var wrap = document.createElement('div');
                wrap.className = 'admin-form-row';
                wrap.style.cssText = 'align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.08)';
                var label = document.createElement('span');
                label.textContent = row.name;
                label.style.cssText = 'flex:1;font-size:0.9rem';
                var select = document.createElement('select');
                select.className = 'admin-select';
                select.style.cssText = 'width:auto;min-width:110px';
                [''].concat(season3GroupIds).forEach(function (gid) {
                    var opt = document.createElement('option');
                    opt.value = gid;
                    opt.textContent = gid ? 'Group ' + gid : '未分組';
                    select.appendChild(opt);
                });
                select.addEventListener('change', function () {
                    s3DrawState[index].group = select.value;
                    updateSeason3DrawCounters();
                });
                wrap.appendChild(label);
                wrap.appendChild(select);
                season3DrawList.appendChild(wrap);
            });
            updateSeason3DrawCounters();
            randomizeSeason3Draw();
        }

        function randomizeSeason3Draw() {
            if (!s3DrawState.length) return;
            var pool = s3DrawState.map(function (row) { return row.id; });
            for (var i = pool.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
            }
            var byId = {};
            s3DrawState.forEach(function (row) { byId[row.id] = row; });
            pool.forEach(function (teamId, index) {
                byId[teamId].group = season3GroupIds[Math.floor(index / s3GroupSize)];
            });
            var selects = season3DrawList.querySelectorAll('select');
            s3DrawState.forEach(function (row, index) {
                if (selects[index]) selects[index].value = row.group;
            });
            updateSeason3DrawCounters();
        }

        function updateSeason3DrawCounters() {
            var counts = {};
            season3GroupIds.forEach(function (gid) { counts[gid] = 0; });
            s3DrawState.forEach(function (row) { if (row.group) counts[row.group]++; });
            season3DrawCounters.innerHTML = season3GroupIds.map(function (gid) {
                return '<span style="font-size:0.82rem;font-weight:700;color:' + (counts[gid] === s3GroupSize ? '#38a169' : 'inherit') + '">Group ' + gid + ' ' + counts[gid] + '/' + s3GroupSize + '</span>';
            }).join('');
            var ready = s3DrawState.every(function (row) { return row.group; }) && season3GroupIds.every(function (gid) { return counts[gid] === s3GroupSize; });
            season3GenerateBtn.disabled = !ready;
        }

        function renderSeason3GroupsView(data, games) {
            season3StatusEl.textContent = '';
            var html = '';
            function phaseBlock(title, groups, status, sourceLabelFn) {
                var inner = (groups || []).map(function (group) {
                    var names = (group.teams || []).map(function (row) {
                        return _esc(row.teamName || '未知球隊') + (sourceLabelFn ? sourceLabelFn(row) : '');
                    }).join('、');
                    return '<div style="margin-bottom:8px"><strong style="font-size:0.85rem">Group ' + _esc(group.groupId) + '</strong><div class="text-muted" style="font-size:0.88rem">' + names + '</div></div>';
                }).join('');
                var progress = status && status.total ? '<div class="text-muted" style="font-size:0.8rem;margin-bottom:8px">' + title + ' ' + status.completed + '/' + status.total + ' 場已完成</div>' : '';
                return '<h3 style="font-size:0.95rem;margin:0 0 10px">' + _esc(title) + '</h3>' + progress + inner;
            }
            html += '<div style="margin-bottom:18px">' + phaseBlock('分組賽抽籤', s3GroupsData.preliminary, s3GroupsData.gamesStatus && s3GroupsData.gamesStatus.preliminary) + '</div>';
            var crossStatus = s3GroupsData.gamesStatus && s3GroupsData.gamesStatus.regular;
            if (s3GroupSize === 6) {
                html += '<div class="text-muted" style="font-size:0.85rem;margin-bottom:8px">跨組對壘：' +
                    (crossStatus && crossStatus.total ? crossStatus.completed + '/' + crossStatus.total + ' 場已完成' : '未生成') +
                    '（每組第 1–3 名對 Group B 同名次；第 4–6 名對另一組同名次）</div>';
            } else if (crossStatus && crossStatus.total) {
                html += '<div class="text-muted" style="font-size:0.85rem;margin-bottom:8px">跨組對壘：' + crossStatus.completed + '/' + crossStatus.total + ' 場已完成</div>';
            }
            var cupGames = (games || []).filter(function (g) { return g.phase === 'playoffs'; });
            var beltGames = (games || []).filter(function (g) { return g.phase === 'goldBelt'; });
            html += '<div class="text-muted" style="font-size:0.85rem">MJ23／LBJ23 Cup：' + (cupGames.length ? cupGames.length + ' 場已生成' : '未生成') + '；金腰帶爭奪戰：' + (beltGames.length ? '已生成' : '未生成') + '</div>';
            season3GroupsView.innerHTML = html;
            season3GroupsView.hidden = false;
        }

        season3FlagBtn.addEventListener('click', function () {
            if (!seasonSelect.value) return;
            season3FlagBtn.disabled = true;
            API.post('updateSeason', { seasonId: seasonSelect.value, formatVersion: 'season3' }).then(function () {
                showMsg('已標示為 Season 3 賽制', 'success');
                return API.getSeasons();
            }).then(function (list) {
                allSeasons = list || [];
                loadSeason3Setup();
            }).catch(function (err) {
                showMsg((err && err.message) || I18n.t('error.submitFailed'), 'error');
                season3FlagBtn.disabled = false;
            });
        });

        season3AutodrawBtn.addEventListener('click', function () {
            randomizeSeason3Draw();
        });

        season3GenerateBtn.addEventListener('click', function () {
            if (season3GenerateBtn.disabled) return;
            var assignments = {}, summary = {};
            season3GroupIds.forEach(function (gid) { assignments[gid] = []; summary[gid] = []; });
            for (var i = 0; i < s3DrawState.length; i++) {
                var row = s3DrawState[i];
                if (!row.group || assignments[row.group].indexOf(row.id) !== -1) { showMsg('分組不完整：每隊須指派到一個小組', 'error'); return; }
                assignments[row.group].push(row.id);
                summary[row.group].push(row.name);
            }
            var complete = season3GroupIds.every(function (gid) { return assignments[gid].length === s3GroupSize; });
            if (!complete) { showMsg('分組不完整：每組須剛好 ' + s3GroupSize + ' 隊', 'error'); return; }
            var groupGames = season3GroupIds.length * s3GroupSize * (s3GroupSize - 1) / 2;
            var message = '確認分組抽籤？\n' + season3GroupIds.map(function (gid) {
                return 'Group ' + gid + '：' + summary[gid].join('、');
            }).join('\n') + '\n\n確認後生成 ' + groupGames + ' 場組內單循環預賽' + (s3GroupSize === 6 ? '（其後另需生成 9 場跨組對壘）' : '') + '，此操作不可重複。';
            if (!window.confirm(message)) return;
            season3GenerateBtn.disabled = true;
            API.post('generateSeason3Preliminary', { seasonId: seasonSelect.value, groupAssignments: assignments }).then(function (result) {
                showMsg((result && result.message) || 'Season 3 預賽分組及賽程已生成', 'success');
                loadSeason3Setup();
            }).catch(function (err) {
                showMsg((err && err.message) || I18n.t('error.submitFailed'), 'error');
                updateSeason3DrawCounters();
            });
        });

        document.getElementById('btn-save-team').addEventListener('click', function () {
            teamLogoImport.ready().then(function () {
            var data = {
                seasonId: seasonSelect.value,
                name: document.getElementById('team-name').value.trim(),
                division: document.getElementById('team-division').value.trim().toUpperCase(),
                logo: teamLogoImport.getValue(),
                captain: document.getElementById('team-captain').value.trim(),
                captainWhatsApp: document.getElementById('team-whatsapp').value.trim(),
                description: document.getElementById('team-desc').value.trim(),
                jerseyHome: document.getElementById('team-jersey-home').value.trim(),
                jerseyAway: document.getElementById('team-jersey-away').value.trim()
            };
            if (!data.name) { showMsg(I18n.t('error.requiredField', { field: 'name' }), 'error'); return; }
            if (!data.seasonId) { showMsg(I18n.t('error.requiredField', { field: 'seasonId' }), 'error'); return; }

            var action = editingId ? 'updateTeam' : 'createTeam';
            if (editingId) data.teamId = editingId;

            API.post(action, data).then(function () {
                showMsg(editingId ? I18n.t('admin.updateSuccess') : I18n.t('admin.submitSuccess'), 'success');
                resetForm();
                loadTeams();
                loadSeason3Setup();
            }).catch(function () { showMsg(I18n.t('error.submitFailed'), 'error'); });
            });
        });

        function _esc(str) { var d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
        function _genToken() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        loadSeasons();
    })();
    </script>
</body>
</html>
