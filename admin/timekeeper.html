<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#13213f">
  <meta name="description" content="ALL-IN 時間員即時記錄台">
  <title>時間員記錄台｜ALL-IN Basketball League</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/admin.css?v=20261013-timekeeper">
  <style>
    body{background:linear-gradient(145deg,#eef4ff,#f8fafc);min-height:100vh}.timekeeper-shell{max-width:920px;margin:0 auto;padding:28px 18px 50px}.timekeeper-hero{padding:24px;border-radius:18px;background:#13213f;color:#fff;box-shadow:0 12px 28px rgba(15,35,70,.2)}.timekeeper-hero h1{margin:0;font-size:clamp(1.45rem,4vw,2.25rem)}.timekeeper-hero p{margin:8px 0 0;color:#c9d8f4}.timekeeper-card{margin-top:18px;padding:20px;border:1px solid #d7e2f4;border-radius:18px;background:#fff;box-shadow:0 6px 18px rgba(15,35,70,.08)}.timekeeper-games{display:grid;gap:12px;margin-top:14px}.timekeeper-game{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:17px;border:1px solid #c8d8f2;border-radius:14px;background:#f8fbff}.timekeeper-game time{display:block;color:#526a96;font-size:.86rem;font-weight:800}.timekeeper-game strong{display:block;margin-top:3px;color:#17223a;font-size:1.05rem}.timekeeper-game .btn{min-height:58px;padding-inline:20px;font-size:1rem;white-space:nowrap}.timekeeper-empty{padding:35px 10px;color:#64748b;text-align:center}@media(max-width:560px){.timekeeper-shell{padding:15px 12px 35px}.timekeeper-game{grid-template-columns:1fr}.timekeeper-game .btn{width:100%}}
  </style>
</head>
<body>
  <main class="timekeeper-shell">
    <header class="timekeeper-hero"><h1>🏀 時間員即時記錄台</h1><p>選擇比賽後進入平板即時統計。此頁不提供其他管理功能。</p></header>
    <section class="timekeeper-card">
      <label for="timekeeper-season" class="admin-label">選擇賽季</label>
      <select id="timekeeper-season" class="admin-select"><option value="">載入中…</option></select>
      <div id="timekeeper-status" class="admin-message" hidden></div>
      <div id="timekeeper-games" class="timekeeper-games" aria-live="polite"></div>
    </section>
  </main>
  <script src="../js/utils.js?v=20260409"></script>
  <script src="../js/api.js?v=20261013-timekeeper"></script>
  <script src="auth.js?v=20260410"></script>
  <script>
  (function(){
    var seasonSelect=document.getElementById('timekeeper-season'),gamesEl=document.getElementById('timekeeper-games'),statusEl=document.getElementById('timekeeper-status');
    function showStatus(message,type){statusEl.textContent=message;statusEl.className='admin-message admin-message--'+(type||'info');statusEl.hidden=false}
    function defaultSeason(seasons){var active=(seasons||[]).filter(function(s){return String(s.status||'').toLowerCase()==='active'});return active[active.length-1]||(seasons||[])[(seasons||[]).length-1]}
    function loadGames(){var sid=seasonSelect.value;if(!sid){gamesEl.innerHTML='';return}gamesEl.innerHTML='<div class="timekeeper-empty">載入比賽中…</div>';API.getGames(sid).then(function(games){games=(games||[]).filter(function(g){return String(g.status||'').toLowerCase()!=='cancelled'}).sort(function(a,b){return String(a.date||'').localeCompare(String(b.date||''))||String(a.time||'').localeCompare(String(b.time||''))});if(!games.length){gamesEl.innerHTML='<div class="timekeeper-empty">此賽季暫未有可記錄的比賽。</div>';return}gamesEl.innerHTML=games.map(function(g){var complete=String(g.status||'').toLowerCase()==='completed';var label=(g.homeTeamName||g.homeTeamId)+' vs '+(g.awayTeamName||g.awayTeamId);var date=(typeof Utils!=='undefined'?Utils.formatDateWithDay(g.date):g.date)+(g.time?' · '+g.time:'');return '<article class="timekeeper-game"><div><time>'+escapeHtml(date)+'</time><strong>'+escapeHtml(label)+'</strong></div><a class="btn btn-primary" href="boxscore.html?timekeeper=1&gameId='+encodeURIComponent(g.id)+'">'+(complete?'查看／更正':'開始即時記錄')+'</a></article>'}).join('')}).catch(function(){gamesEl.innerHTML='<div class="timekeeper-empty">無法載入比賽，請重新整理。</div>'})}
    function escapeHtml(value){var d=document.createElement('div');d.textContent=value||'';return d.innerHTML}
    API.getSeasons().then(function(seasons){seasonSelect.innerHTML='';(seasons||[]).forEach(function(s){var o=document.createElement('option');o.value=s.id;o.textContent=s.name||s.id;seasonSelect.appendChild(o)});var current=defaultSeason(seasons);if(current){seasonSelect.value=current.id;loadGames()}else{showStatus('沒有可用賽季','error')}}).catch(function(){showStatus('無法載入賽季','error')});seasonSelect.addEventListener('change',loadGames)
  })();
  </script>
</body>
</html>
