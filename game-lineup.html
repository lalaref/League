<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#065f46">
  <meta name="description" content="ALL-IN Basketball League 本場上陣名單">
  <title>本場上陣名單｜ALL-IN Basketball League</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/admin.css?v=20261015-game-number">
  <style>
    body{min-height:100vh;background:linear-gradient(150deg,#ecfdf5 0,#f8fbff 48%,#eefbf5 100%)}.lineup-shell{max-width:720px;margin:0 auto;padding:22px 16px 48px}.lineup-hero{padding:28px 24px;border:3px solid #064e3b;border-radius:22px;background:linear-gradient(125deg,#064e3b,#059669);box-shadow:0 14px 34px rgba(6,95,70,.28);color:#fff;text-align:center}.lineup-hero-badge{display:inline-block;padding:6px 11px;border-radius:999px;background:#fbbf24;color:#452600;font-size:.78rem;font-weight:1000;letter-spacing:.08em}.lineup-hero h1{margin:12px 0 7px;font-size:clamp(1.75rem,7vw,2.55rem);font-weight:1000;letter-spacing:.02em;line-height:1.12;text-shadow:0 2px 1px rgba(0,0,0,.22)}.lineup-hero p{margin:0;color:#e4efff;font-size:1rem;font-weight:700}.lineup-card{margin-top:18px;padding:22px;border:1px solid #b8d0f4;border-radius:20px;background:#fff;box-shadow:0 8px 24px rgba(22,66,125,.12)}.lineup-fixture{margin:0;padding:13px;border-radius:12px;background:#edf5ff;color:#163967;font-size:.95rem;font-weight:900;text-align:center}.lineup-team-title{margin:18px 0 8px;color:#102f60;font-size:1.35rem;font-weight:1000;text-align:center}.lineup-side{margin:0 0 16px;color:#2563eb;font-size:.95rem;font-weight:900;text-align:center}.lineup-list{display:grid;gap:9px}.lineup-player{display:grid;grid-template-columns:auto auto minmax(0,1fr) 92px;align-items:center;gap:10px;min-height:57px;padding:9px 12px;border:2px solid #cfddf3;border-radius:13px;background:#fff;color:#16243c;cursor:pointer;font-size:1.02rem;font-weight:900}.lineup-player:has(input:checked){border-color:#1d4ed8;background:#eaf2ff;box-shadow:0 0 0 2px rgba(29,78,216,.12)}.lineup-player input[type="checkbox"]{width:22px;height:22px;accent-color:#1d4ed8}.lineup-player-number{display:grid;width:34px;height:34px;place-items:center;border-radius:50%;background:#dbeafe;color:#0f3d88;font-weight:1000}.lineup-number-field{min-width:0}.lineup-number-field label{display:block;color:#526a96;font-size:.62rem;font-weight:900}.lineup-number-field input{width:100%;box-sizing:border-box;padding:6px;border:1px solid #a9c4eb;border-radius:7px;background:#fff;color:#102f60;font:inherit;font-size:.9rem;text-align:center}.lineup-add-player{margin-top:16px;padding:14px;border:1px solid #b9d8c6;border-radius:13px;background:#f0fdf4}.lineup-add-player h3{margin:0 0 10px;color:#14532d;font-size:1rem}.lineup-add-grid{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px}.lineup-add-grid input{min-width:0;padding:9px;border:1px solid #9fc7ad;border-radius:8px;font:inherit}.lineup-add-grid .btn{min-height:42px;font-weight:900}.lineup-add-note{margin:8px 0 0;color:#527261;font-size:.76rem;line-height:1.35}.lineup-actions{display:grid;gap:10px;margin-top:20px}.lineup-actions .btn{min-height:58px;font-size:1.05rem;font-weight:1000}.lineup-note{margin:0;color:#64748b;font-size:.88rem;line-height:1.45;text-align:center}.lineup-empty{padding:36px 10px;color:#64748b;text-align:center}.lineup-locked{padding:16px;border-radius:12px;background:#fff4d8;color:#805300;font-weight:900;text-align:center}@media(max-width:480px){.lineup-shell{padding:13px 12px 32px}.lineup-hero{padding:24px 16px;border-radius:18px}.lineup-card{padding:16px}.lineup-player{grid-template-columns:auto auto minmax(0,1fr);gap:7px}.lineup-number-field{grid-column:2 / -1}.lineup-add-grid{grid-template-columns:1fr 78px}.lineup-add-grid .btn{grid-column:1 / -1}.lineup-player{min-height:54px}}
  </style>
</head>
<body>
  <main class="lineup-shell">
    <header class="lineup-hero"><span class="lineup-hero-badge">ALL-IN BASKETBALL LEAGUE</span><h1>本場上陣名單</h1><p>請勾選本場預計上陣的球員，完成後按「儲存名單」。</p></header>
    <section class="lineup-card">
      <div id="lineup-loading" class="lineup-empty">載入名單中…</div>
      <div id="lineup-error" class="admin-message admin-message--error" role="alert" hidden></div>
      <div id="lineup-content" hidden>
        <p id="lineup-fixture" class="lineup-fixture"></p>
        <h2 id="lineup-team-title" class="lineup-team-title"></h2>
        <p id="lineup-side" class="lineup-side"></p>
        <div id="lineup-players" class="lineup-list"></div>
        <section id="lineup-add-player" class="lineup-add-player" aria-label="新增球員">
          <h3>＋ 增加新球員</h3>
          <div class="lineup-add-grid"><input id="lineup-new-player-name" type="text" maxlength="60" placeholder="球員名稱"><input id="lineup-new-player-number" type="text" inputmode="numeric" maxlength="3" placeholder="背號"><button id="btn-add-lineup-player" type="button" class="btn btn-outline">加入名單</button></div>
          <p class="lineup-add-note">新球員會加入你的球隊正式名單，加入後請勾選並儲存本場上陣名單。</p>
        </section>
        <div class="lineup-actions"><button id="btn-save-lineup" type="button" class="btn btn-primary">✓ 儲存本場上陣名單</button><p class="lineup-note">此連結只可設定你的球隊本場名單，不會顯示或更改對手球員。</p></div>
      </div>
    </section>
  </main>
  <script src="js/utils.js?v=20260409"></script>
  <script src="js/api.js?v=20261015-game-number"></script>
  <script src="js/game-lineup.js?v=20261015-game-number"></script>
</body>
</html>
